<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Round Robin Clean</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Basic Mobile Web App Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased select-none">

  <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col p-4 pb-12">
    <!-- Header -->
    <header class="mb-6 pt-4">
      <span class="text-xs font-semibold tracking-widest text-emerald-400 uppercase">Current Rotation</span>
      <h1 class="text-3xl font-extrabold tracking-tight text-white">{{ activeRoom.name }}</h1>
      <p class="text-xs text-gray-400 mt-1">Automatically rotates next Monday at midnight</p>
    </header>

    <!-- Task List -->
    <main class="flex-1 space-y-3">
      <div 
        v-for="task in orderedTasks" 
        :key="task.id"
        @click="toggleTask(task.id)"
        :class="['flex items-center justify-between p-4 rounded-xl border transition-all duration-200 cursor-pointer', 
                 task.done ? 'bg-gray-800/40 border-gray-800 text-gray-500 line-through' : 'bg-gray-800 border-gray-700/60 shadow-sm active:scale-[0.98]']"
      >
        <span class="font-medium text-sm pr-4">{{ task.text }}</span>
        <div :class="['w-5 h-5 rounded-md border flex items-center justify-center shrink-0', 
                      task.done ? 'bg-emerald-500 border-emerald-500 text-gray-900' : 'border-gray-500']">
          <svg v-if="task.done" class="w-3.5 h-3.5 stroke-2 stroke-current" fill="none" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
        </div>
      </div>
    </main>
  </div>

  <script>
    const { createApp } = Vue;

    // Fixed configuration data populated with your full custom list
    const ROOMS = [
      {
        id: 'kitchen', 
        name: 'Kitchen & dining', 
        tasks: [
          'Stovetop', 
          'Oven exterior & knobs', 
          'Microwave interior & exterior', 
          'Dishwasher door edges & filter', 
          'Wipe fridge shelves & door seals', 
          'Purge expired pantry items',
          'Wipe cabinet fronts & handles', 
          'Drawers', 
          'Windows & sills', 
          'Toaster crumb tray & small electrics', 
          'Walls & baseboards spot-clean', 
          'Mop floor', 
          'Chairs & table legs wipe down', 
          'Wipe light switches & outlets', 
          'Dust high ledges'
        ]
      },
      {
        id: 'bathroom', 
        name: 'Bathroom', 
        tasks: [ 
          'Mirror & faucet polishing',
          'Toilet bowl',
          'Toilet seat',
          'Toilet base', 
          'Empty & sanitise bin', 
          'Wash shower curtains', 
          'Purge expired products', 
          'Wipe cabinet fronts & handles',
          'Wipe cabinet shelves', 
          'Wipe bathroom sink',
          'Hair catch',
          'Windows & sills', 
          'Scrub shower wall grout tiles', 
          'Dust ventilation grates', 
          'Walls & baseboards', 
          'Wipe light switches & door',
          'Wipe door',
          'Wash floor'
        ]
      },
      {
        id: 'bedroom',
        name: 'Bedroom',
        tasks: [
          'Sweep/vacuum under bed', 
          'Wipe closet doors & handles',
          'Tidy clothes rail rooms',
          'Tidy a shelf',
          'Flip or rotate mattress', 
          'Windows & sills', 
          'Dust light fixtures & bedside electrics', 
          'Walls & baseboards', 
          'Wipe door & light switches',
          'Wipe surfaces',
          'Mop floor'
        ]
      },
      {
        id: 'living', 
        name: 'Living Room', 
        tasks: [
          'Vacuum sofa cushions & creases', 
          "Vacuum areas robot can't get to", 
          'Windows & sills', 
          'Sanitise remotes & dust TV screen', 
          'Walls & baseboards', 
          'Wipe light switches', 
          'Wipe doors',
          'Wipe surfaces'
        ]
      },
      {
        id: 'entry',
        name: 'Entry',
        tasks: [
          'Windows & mirrors', 
          'Shake & vacuum doormat', 
          'Scrub boot trays', 
          'Match & purge stray shoes/coats', 
          'Wipe front door & switches', 
          'Walls & baseboards', 
          'Dust'
        ]
      },
      {
        id: 'laundry',
        name: 'Laundry',
        tasks: [
          'Washing machine outside', 
          'Washing machine auto-dose unit', 
          'Washing machine filter drain', 
          'Washing machine rubber seal wipe',
          'Washing machine inner glass',
          'Dryer outside & control panel',
          'Wipe dryer door seal & inner glass',
          'Vacuum inside the lint trap cavity',
          'Pull out and rinse condensation unit block'
        ]
      },
      {
        id: 'office',
        name: 'Office',
        tasks: [
          'Windows & sills',
          'Organise workstation',
          'Sanitise laptop',
          'Sanitise primary monitor',
          'Sanitise mouse & keyboard', 
          'Walls & baseboards', 
          'Vacuum/wipe air filter exterior & pre-filter',
          'Wipe down surfaces around the litter box area',
          'Dust Kallax top & empty cubes',
          'Pull out Kallax baskets to dust behind them',
          'Wipe catch-all closet outside',
          'Organise pet gear & check cleaning supply stock',
          'Neaten foil, trash bags, toilet paper & kitchen towels',
          'Wipe light switches & door'
        ]
      }
    ];


    const EPOCH_DATE = new Date('2026-01-05T00:00:00'); 

    createApp({
      data() {
        return {
          rooms: ROOMS,
          roomPointers: JSON.parse(localStorage.getItem('room_pointers') || '{}'),
          checkedStates: JSON.parse(localStorage.getItem('completed_tasks') || '{}'),
          lastProcessedWeek: localStorage.getItem('last_week')
        }
      },
      computed: {
        currentWeekOffset() {
          const now = new Date();
          return Math.floor((now - EPOCH_DATE) / (1000 * 60 * 60 * 24 * 7));
        },
        activeRoomIndex() {
          return this.currentWeekOffset % this.rooms.length;
        },
        activeRoom() {
          return this.rooms[this.activeRoomIndex];
        },
        orderedTasks() {
          const room = this.activeRoom;
          const currentPointer = this.roomPointers[room.id] || 0;
          
          const items = room.tasks.map((taskText, idx) => ({
            id: `${room.id}_${idx}`,
            text: taskText,
            originalIndex: idx,
            done: !!this.checkedStates[`${room.id}_${idx}_w${this.currentWeekOffset}`]
          }));

          // Rotate using the dynamic pointer stored from actual previous usage
          const shifted = [...items.slice(currentPointer), ...items.slice(0, currentPointer)];

          return shifted.sort((a, b) => a.done - b.done);
        }
      },
      created() {
        this.handleRoomTransition();
      },
      methods: {
        handleRoomTransition() {
          const currentWeek = this.currentWeekOffset;
          
          if (this.lastProcessedWeek && parseInt(this.lastProcessedWeek) !== currentWeek) {
            const previousWeek = parseInt(this.lastProcessedWeek);
            const prevRoomIndex = previousWeek % this.rooms.length;
            const prevRoom = this.rooms[prevRoomIndex];
            
            let completedCount = 0;
            prevRoom.tasks.forEach((_, idx) => {
              if (this.checkedStates[`${prevRoom.id}_${idx}_w${previousWeek}`]) {
                completedCount++;
              }
            });

            if (completedCount > 0) {
              const currentPointer = this.roomPointers[prevRoom.id] || 0;
              const newPointer = (currentPointer + completedCount) % prevRoom.tasks.length;
              this.roomPointers[prevRoom.id] = newPointer;
              localStorage.setItem('room_pointers', JSON.stringify(this.roomPointers));
            }
          }
          
          this.lastProcessedWeek = currentWeek.toString();
          localStorage.setItem('last_week', this.lastProcessedWeek);
        },
        toggleTask(id) {
          const key = `${id}_w${this.currentWeekOffset}`;
          if (this.checkedStates[key]) {
            delete this.checkedStates[key];
          } else {
            this.checkedStates[key] = true;
          }
          localStorage.setItem('completed_tasks', JSON.stringify(this.checkedStates));
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
